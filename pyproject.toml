[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-pilot"
version = "0.1.0"
description = "Offline software diagnostics for provenance-aware evidence aggregation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["Pillow==12.3.0"]

[project.scripts]
provenance-pilot = "provenance_pilot.__main__:main"

[tool.setuptools.packages.find]
include = ["provenance_pilot*"]
